    bindings: ['alt+h']
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['shell-exec C:/Users/Matthew/Personal/dotfiles/.config/glazewm/cycle-windows.exe --focus-down']
    bindings: ['alt+j']
  - commands: ['move --direction down']
